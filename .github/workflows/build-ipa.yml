name: Build IPA non firmato

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compila e impacchetta
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versioni toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate --spec project.yml

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lente.xcodeproj \
            -scheme Lente \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            clean build

      - name: Impacchetta in .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Lente.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Non trovo $APP_PATH"
            find build -name "*.app" -maxdepth 6 || true
            exit 1
          fi
          rm -rf Payload Lente2-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Lente2-unsigned.ipa Payload
          unzip -l Lente2-unsigned.ipa | head -20
          ls -lh Lente2-unsigned.ipa

      - name: Pubblica l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lente2-unsigned-ipa
          path: Lente2-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Allega alla release sul tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Lente2-unsigned.ipa \
            --title "Lente 2 ${GITHUB_REF_NAME}" \
            --notes "IPA non firmato. Installalo con AltStore, SideStore o Sideloadly." \
            || gh release upload "${GITHUB_REF_NAME}" Lente2-unsigned.ipa --clobber
